name: Verificarea colocviului

on:
  push:
    branches:
      - "colocviu/**"
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: colocviu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verificare:
    name: Sarcinile 1, 3 și 4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: pdftotext, pentru citirea PDF-ului
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null

      - name: Verificările (tabelul punctelor apare în Summary)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COLOCVIU_RAMURA: ${{ github.head_ref || github.ref_name }}
          # varianta permisă, după numele depozitului: dctc-colocviu-proba (S), dctc-restanta (D–F), altfel colocviul (A–C)
          COLOCVIU_SESIUNE: ${{ endsWith(github.event.repository.name, '-proba') && 'simulare' || (contains(github.event.repository.name, 'restanta') && 'restanta' || 'colocviu') }}
        run: python3 tests/check_colocviu.py all | tee -a "$GITHUB_STEP_SUMMARY"
